# Later, when tasks.sunspec.co.za should serve the board.
# certbot --nginx -d tasks.sunspec.co.za will add the HTTPS server.
server {
    listen 80;
    listen [::]:80;
    server_name tasks.sunspec.co.za;

    # 5 PDFs × 15 MB, plus the bot upload. The live VPS copy of this file needs the same value.
    client_max_body_size 80m;

    # /api/bot is public on this host. The app checks Authorization: Bearer.
    location /api/bot/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
